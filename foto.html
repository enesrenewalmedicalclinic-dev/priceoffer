<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Renewal Medical Clinic · Photo guide</title>
<style>
:root{--red:#b3262f;--navy:#1f2a37;--bg:#faf7f2;--line:#e6e1d8;--muted:#6b6b6b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--navy);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;margin-bottom:10px}header img{width:44px;height:44px;object-fit:contain}
header b{display:block;font-size:1.02rem;letter-spacing:.01em}header span{font-size:.8rem;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h1{font-size:1.25rem;margin:0 0 6px}h2{font-size:1.05rem;margin:0 0 4px}p{margin:6px 0}
.muted{color:var(--muted);font-size:.88rem}
ul.list{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px}ul.list li{display:flex;gap:8px;align-items:center;font-size:.93rem}
ul.list li i{font-style:normal;flex:none;width:22px;height:22px;border-radius:50%;background:#f3ede3;display:grid;place-items:center;font-size:.75rem;font-weight:700}
.btn{appearance:none;border:0;border-radius:999px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--red);color:#fff;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn[disabled]{opacity:.45;cursor:not-allowed}.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.wa{background:#1fa855}
.row{display:flex;gap:8px}.row>*{flex:1}
label.ck{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;margin:12px 0;cursor:pointer}label.ck input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--red)}
.stage{position:relative;width:min(100%,calc(54vh * .75));margin:0 auto;aspect-ratio:3/4;background:#111;border-radius:16px;overflow:hidden}
.stage video,.stage img.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage video.mir{transform:scaleX(-1)}
.stage svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage .cnt{position:absolute;inset:0;display:grid;place-items:center;font-size:5rem;font-weight:800;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.stage .msg{position:absolute;inset:0;display:grid;place-items:center;padding:22px;text-align:center;color:#fff;font-size:.95rem}
.ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px}
.shutter{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:var(--red);box-shadow:0 0 0 2px var(--red);cursor:pointer;flex:none}
.shutter[disabled]{opacity:.4}
.ic{appearance:none;border:1px solid var(--line);background:#fff;border-radius:999px;min-width:48px;height:48px;padding:0 12px;font:inherit;font-size:.82rem;cursor:pointer;display:flex;align-items:center;gap:6px;justify-content:center;color:var(--navy)}
.ic.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.prog{display:flex;gap:4px;margin:2px 0 10px}.prog span{flex:1;height:5px;border-radius:9px;background:#e8e2d8}.prog span.done{background:var(--red)}.prog span.cur{background:#e9a9ad}
.pic{flex:none;width:104px;height:120px;background:#f6f8fa;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pic svg{width:100%;height:100%;display:block}.pic img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}.pic:has(img){background:#fff}
.shead{display:flex;gap:12px;align-items:center}
.stage .flab{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(15,27,45,.72);color:#fff;font-size:.8rem;font-weight:600;padding:5px 12px;border-radius:999px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:10px 0 0;padding:0;list-style:none}
.plist li{border:1px solid var(--line);border-radius:12px;padding:6px;min-width:0;overflow:hidden;display:grid;gap:4px;justify-items:center;text-align:center;font-size:.8rem;line-height:1.25;background:#fff}
.plist li .pic{width:100%;height:auto;aspect-ratio:3/4;border:0}
.plist li b{font-size:.72rem;color:#9aa1ad}
.tip{background:#fff8e8;border:1px solid #f1dfb4;border-radius:12px;padding:9px 11px;font-size:.88rem;margin:8px 0 0}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.thumbs figure{margin:0;position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#eee;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover}.thumbs figcaption{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:.68rem;padding:3px 5px;line-height:1.2}
.thumbs button{position:absolute;top:4px;right:4px;border:0;border-radius:999px;background:rgba(255,255,255,.92);font-size:.7rem;padding:3px 7px;cursor:pointer}
.thumbs figure.miss{display:grid;place-items:center;color:var(--muted);font-size:.75rem;text-align:center;padding:6px}
.dl{display:grid;gap:6px;margin-top:8px}.dl a{color:var(--navy);font-size:.9rem}
.ok{font-size:3rem;text-align:center;margin:6px 0}
[hidden]{display:none!important}
html[dir=rtl] .ctrl,html[dir=rtl] header{direction:rtl}
</style>
</head>
<body>
<main>
  <header><img src="tpl/dent/logo_big.png" alt=""><div><b>Renewal Medical Clinic</b><span id="hSub"></span></div></header>

  <section class="card" id="vIntro">
    <h1 id="tTitle"></h1>
    <p id="tIntro"></p>
    <ul class="plist" id="stepList"></ul>
    <p class="tip" id="tLight"></p>
    <label class="ck"><input type="checkbox" id="consent"><span id="tConsent"></span></label>
    <button class="btn" id="bStart" disabled></button>
    <p class="muted" id="tPrivacy" style="margin-top:10px"></p>
  </section>

  <section id="vCam" hidden>
    <div class="prog" id="prog"></div>
    <div class="card" style="padding:10px 14px;margin-bottom:8px">
      <div class="shead"><div class="pic" id="sPic"></div><div><p class="muted" id="sCount" style="margin:0"></p><h2 id="sTitle"></h2></div></div>
      <p class="tip" id="sTip"></p><p class="muted" id="sHelp" hidden></p>
    </div>
    <div class="stage" id="stage">
      <video id="vid" playsinline muted autoplay></video>
      <img class="shot" id="shot" alt="" hidden>
      <svg class="ov" id="ov" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice"></svg>
      <div class="flab" id="fLab"></div>
      <div class="cnt" id="cnt" hidden></div>
      <div class="msg" id="camMsg" hidden></div>
    </div>
    <div class="ctrl" id="ctrlLive">
      <button class="ic" id="bFlip" type="button">⟲ <span id="tFlip"></span></button>
      <button class="shutter" id="bShoot" type="button"></button>
      <button class="ic" id="bTimer" type="button">⏱ 3s</button>
    </div>
    <div class="ctrl" id="ctrlShot" hidden>
      <button class="btn sec" id="bRetake" type="button"></button>
      <button class="btn" id="bUse" type="button"></button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn sec" id="bGallery" type="button"></button>
      <button class="btn sec" id="bSkip" type="button"></button>
    </div>
    <input type="file" id="fGal" accept="image/*" hidden>
  </section>

  <section class="card" id="vReview" hidden>
    <h1 id="rTitle"></h1>
    <div class="thumbs" id="thumbs"></div>
    <p class="tip" id="rHint"></p>
    <button class="btn wa" id="bSend" type="button" style="margin-top:12px"></button>
    <div id="fallback" hidden>
      <p class="tip" id="tFallback"></p>
      <div class="dl" id="dlList"></div>
      <button class="btn wa" id="bWa" type="button" style="margin-top:10px" hidden></button>
    </div>
    <p class="muted" id="tPrivacy2" style="margin-top:10px"></p>
  </section>

  <section class="card" id="vDone" hidden>
    <div class="ok">✅</div><h1 id="dTitle" style="text-align:center"></h1>
    <button class="btn sec" id="bAgain" type="button" style="margin-top:12px"></button>
  </section>
</main>

smile:{tr:['Genel görünüm – gülümseyerek','Dişleriniz kapalı, geniş gülümseyin. Yüzünüzün tamamı ve dişleriniz görünsün.'],en:['Overall look – smiling','Teeth together, big smile. Your whole face and your teeth should be visible.'],de:['Gesamtbild – lächelnd','Zähne zusammen, breit lächeln. Das ganze Gesicht und die Zähne sollen sichtbar sein.'],fr:['Vue d’ensemble – en souriant','Dents serrées, grand sourire. Tout le visage et les dents doivent être visibles.'],es:['Vista general – sonriendo','Dientes juntos, sonrisa amplia. Deben verse toda la cara y los dientes.'],pt:['Visão geral – a sorrir','Dentes juntos, sorriso largo. O rosto inteiro e os dentes devem estar visíveis.'],ru:['Общий вид – с улыбкой','Зубы сомкнуты, широкая улыбка. Должны быть видны всё лицо и зубы.'],bg:['Общ вид – с усмивка','Зъбите затворени, широка усмивка. Да се виждат цялото лице и зъбите.'],it:['Vista d’insieme – sorridendo','Denti chiusi, sorriso ampio. Devono vedersi tutto il viso e i denti.'],pl:['Ogólny widok – z uśmiechem','Zęby zaciśnięte, szeroki uśmiech. Widoczna cała twarz i zęby.'],ar:['المظهر العام – مع الابتسامة','الأسنان مطبقة مع ابتسامة عريضة. يجب أن يظهر الوجه كاملًا والأسنان.'],fa:['نمای کلی – با لبخند','دندان‌ها روی هم، لبخند پهن. کل صورت و دندان‌ها دیده شوند.'],ro:['Aspect general – zâmbind','Dinții strânși, zâmbet larg. Să se vadă toată fața și dinții.']},

bSide:{tr:['Vücut – yandan','Yan tarafınız telefona dönük, kollarınız önde ya da yukarıda.'],en:['Body – side','Side to the phone, arms in front or raised.'],de:['Körper – seitlich','Seite zum Telefon, Arme vorne oder oben.'],fr:['Corps – de profil','De côté face au téléphone, bras devant ou levés.'],es:['Cuerpo – de lado','De lado hacia el teléfono, brazos delante o arriba.'],pt:['Corpo – de lado','De lado para o telemóvel, braços à frente ou levantados.'],ru:['Тело – сбоку','Боком к телефону, руки впереди или подняты.'],bg:['Тяло – отстрани','Странично към телефона, ръцете отпред или вдигнати.'],it:['Corpo – di lato','Di lato verso il telefono, braccia davanti o alzate.'],pl:['Ciało – z boku','Bokiem do telefonu, ręce z przodu lub w górze.'],ar:['الجسم – من الجانب','جانبك باتجاه الهاتف والذراعان للأمام أو مرفوعتان.'],fa:['بدن – از پهلو','پهلو رو به گوشی، دست‌ها جلو یا بالا.'],ro:['Corpul – din lateral','Lateral spre telefon, brațele în față sau ridicate.']},
brSide:{tr:['Göğüs – yandan','Yan tarafınız telefona dönük, kollarınız yanlarda.'],en:['Chest – side','Side to the phone, arms at your sides.'],de:['Brust – seitlich','Seite zum Telefon, Arme seitlich.'],fr:['Poitrine – de profil','De côté face au téléphone, bras le long du corps.'],es:['Pecho – de lado','De lado hacia el teléfono, brazos a los lados.'],pt:['Peito – de lado','De lado para o telemóvel, braços ao lado.'],ru:['Грудь – сбоку','Боком к телефону, руки вдоль тела.'],bg:['Гърди – отстрани','Странично към телефона, ръцете отстрани.'],it:['Seno – di lato','Di lato verso il telefono, braccia lungo i fianchi.'],pl:['Klatka – z boku','Bokiem do telefonu, ręce wzdłuż ciała.'],ar:['الصدر – من الجانب','جانبك باتجاه الهاتف والذراعان على الجانبين.'],fa:['سینه – از پهلو','پهلو رو به گوشی، دست‌ها کنار بدن.'],ro:['Pieptul – din lateral','Lateral spre telefon, brațele pe lângă corp.']},
smileR:{tr:['Gülümseme – sağdan','Başınızı hafifçe sola çevirin; sağ taraftaki dişleriniz görünsün.'],en:['Smile – right side','Turn your head slightly to the left so your right-side teeth show.'],de:['Lächeln – rechte Seite','Kopf leicht nach links drehen, damit die rechten Zähne sichtbar sind.'],fr:['Sourire – côté droit','Tournez légèrement la tête vers la gauche pour montrer les dents du côté droit.'],es:['Sonrisa – lado derecho','Gire un poco la cabeza a la izquierda para que se vean los dientes del lado derecho.'],pt:['Sorriso – lado direito','Vire ligeiramente a cabeça para a esquerda para mostrar os dentes do lado direito.'],ru:['Улыбка – справа','Слегка поверните голову влево, чтобы были видны зубы справа.'],bg:['Усмивка – дясна страна','Завъртете леко главата наляво, за да се виждат зъбите отдясно.'],it:['Sorriso – lato destro','Giri leggermente la testa a sinistra per mostrare i denti del lato destro.'],pl:['Uśmiech – prawa strona','Lekko obróć głowę w lewo, aby widać było zęby po prawej stronie.'],ar:['الابتسامة – الجانب الأيمن','أدر رأسك قليلًا إلى اليسار لتظهر أسنان الجانب الأيمن.'],fa:['لبخند – سمت راست','سرتان را کمی به چپ بچرخانید تا دندان‌های سمت راست دیده شوند.'],ro:['Zâmbet – partea dreaptă','Întoarceți ușor capul spre stânga ca să se vadă dinții din dreapta.']},
smileL:{tr:['Gülümseme – soldan','Başınızı hafifçe sağa çevirin; sol taraftaki dişleriniz görünsün.'],en:['Smile – left side','Turn your head slightly to the right so your left-side teeth show.'],de:['Lächeln – linke Seite','Kopf leicht nach rechts drehen, damit die linken Zähne sichtbar sind.'],fr:['Sourire – côté gauche','Tournez légèrement la tête vers la droite pour montrer les dents du côté gauche.'],es:['Sonrisa – lado izquierdo','Gire un poco la cabeza a la derecha para que se vean los dientes del lado izquierdo.'],pt:['Sorriso – lado esquerdo','Vire ligeiramente a cabeça para a direita para mostrar os dentes do lado esquerdo.'],ru:['Улыбка – слева','Слегка поверните голову вправо, чтобы были видны зубы слева.'],bg:['Усмивка – лява страна','Завъртете леко главата надясно, за да се виждат зъбите отляво.'],it:['Sorriso – lato sinistro','Giri leggermente la testa a destra per mostrare i denti del lato sinistro.'],pl:['Uśmiech – lewa strona','Lekko obróć głowę w prawo, aby widać było zęby po lewej stronie.'],ar:['الابتسامة – الجانب الأيسر','أدر رأسك قليلًا إلى اليمين لتظهر أسنان الجانب الأيسر.'],fa:['لبخند – سمت چپ','سرتان را کمی به راست بچرخانید تا دندان‌های سمت چپ دیده شوند.'],ro:['Zâmbet – partea stângă','Întoarceți ușor capul spre dreapta ca să se vadă dinții din stânga.']},
upper:{tr:['Üst dişler','Başınızı geriye yatırın, ağzınızı iyice açın; telefonu çenenizin altından yukarı doğru tutun.'],en:['Upper teeth','Tilt your head back, open wide and hold the phone below your chin, pointing up.'],de:['Obere Zähne','Kopf nach hinten neigen, Mund weit öffnen, Telefon unter dem Kinn nach oben halten.'],fr:['Dents du haut','Penchez la tête en arrière, ouvrez grand et tenez le téléphone sous le menton, vers le haut.'],es:['Dientes superiores','Incline la cabeza hacia atrás, abra bien la boca y sostenga el teléfono bajo la barbilla, hacia arriba.'],pt:['Dentes de cima','Incline a cabeça para trás, abra bem a boca e segure o telemóvel por baixo do queixo, virado para cima.'],ru:['Верхние зубы','Запрокиньте голову, широко откройте рот и держите телефон под подбородком камерой вверх.'],bg:['Горни зъби','Наклонете главата назад, отворете широко и дръжте телефона под брадичката, насочен нагоре.'],it:['Denti superiori','Inclini la testa all’indietro, apra bene la bocca e tenga il telefono sotto il mento, verso l’alto.'],pl:['Górne zęby','Odchyl głowę do tyłu, szeroko otwórz usta i trzymaj telefon pod brodą, skierowany w górę.'],ar:['الأسنان العلوية','أمِل رأسك للخلف وافتح فمك جيدًا وأمسك الهاتف أسفل ذقنك متجهًا للأعلى.'],fa:['دندان‌های بالا','سر را به عقب ببرید، دهان را کامل باز کنید و گوشی را زیر چانه رو به بالا بگیرید.'],ro:['Dinții de sus','Înclinați capul pe spate, deschideți larg și țineți telefonul sub bărbie, orientat în sus.']},
lower:{tr:['Alt dişler','Başınızı öne eğin, ağzınızı iyice açın; telefonu yukarıdan aşağı doğru tutun.'],en:['Lower teeth','Tilt your head forward, open wide and hold the phone above, pointing down.'],de:['Untere Zähne','Kopf nach vorne neigen, Mund weit öffnen, Telefon von oben nach unten halten.'],fr:['Dents du bas','Penchez la tête en avant, ouvrez grand et tenez le téléphone au-dessus, vers le bas.'],es:['Dientes inferiores','Incline la cabeza hacia delante, abra bien la boca y sostenga el teléfono por encima, hacia abajo.'],pt:['Dentes de baixo','Incline a cabeça para a frente, abra bem a boca e segure o telemóvel por cima, virado para baixo.'],ru:['Нижние зубы','Наклоните голову вперёд, широко откройте рот и держите телефон сверху камерой вниз.'],bg:['Долни зъби','Наклонете главата напред, отворете широко и дръжте телефона отгоре, насочен надолу.'],it:['Denti inferiori','Inclini la testa in avanti, apra bene la bocca e tenga il telefono sopra, verso il basso.'],pl:['Dolne zęby','Pochyl głowę do przodu, szeroko otwórz usta i trzymaj telefon nad nimi, skierowany w dół.'],ar:['الأسنان السفلية','أمِل رأسك للأمام وافتح فمك جيدًا وأمسك الهاتف من الأعلى متجهًا للأسفل.'],fa:['دندان‌های پایین','سر را به جلو خم کنید، دهان را کامل باز کنید و گوشی را از بالا رو به پایین بگیرید.'],ro:['Dinții de jos','Aplecați capul în față, deschideți larg și țineți telefonul deasupra, orientat în jos.']},
xray:{tr:['Panoramik röntgen','Röntgeniniz varsa fotoğrafını ya da dosyasını “Galeriden seç” ile ekleyin; yoksa atlayın.'],en:['Panoramic X-ray','If you have an X-ray, add a photo or file with “Choose from gallery”; otherwise skip.'],de:['Panorama-Röntgenbild','Falls vorhanden, ein Foto oder die Datei über „Aus Galerie wählen“ hinzufügen; sonst überspringen.'],fr:['Radio panoramique','Si vous avez une radio, ajoutez-la avec « Choisir dans la galerie » ; sinon, passez.'],es:['Radiografía panorámica','Si tiene una radiografía, añádala con «Elegir de la galería»; si no, omita este paso.'],pt:['Raio-X panorâmico','Se tiver um raio-X, adicione-o com «Escolher da galeria»; caso contrário, salte.'],ru:['Панорамный снимок','Если у вас есть рентген, добавьте фото или файл через «Выбрать из галереи»; если нет — пропустите.'],bg:['Панорамна снимка','Ако имате рентгенова снимка, добавете я с „Избери от галерията“; иначе пропуснете.'],it:['Panoramica (RX)','Se ha una radiografia, la aggiunga con «Scegli dalla galleria»; altrimenti salti.'],pl:['Pantomogram','Jeśli masz zdjęcie RTG, dodaj je przez „Wybierz z galerii”; jeśli nie — pomiń.'],ar:['صورة الأشعة البانورامية','إذا كانت لديك صورة أشعة فأضفها عبر «اختر من المعرض»، وإلا فتخطَّ هذه الخطوة.'],fa:['رادیوگرافی پانورامیک','اگر رادیوگرافی دارید، با «انتخاب از گالری» اضافه کنید؛ در غیر این صورت رد شوید.'],ro:['Radiografie panoramică','Dacă aveți o radiografie, adăugați-o cu „Alege din galerie”; altfel, săriți peste.']},
front:{tr:['Yüz – önden','Karşıya düz bakın, yüzünüz ifadesiz olsun.'],en:['Face – front','Look straight ahead with a neutral expression.'],de:['Gesicht – von vorne','Geradeaus schauen, neutraler Gesichtsausdruck.'],fr:['Visage – de face','Regardez droit devant, expression neutre.'],es:['Cara – de frente','Mire al frente con expresión neutra.'],pt:['Rosto – de frente','Olhe em frente com expressão neutra.'],ru:['Лицо – анфас','Смотрите прямо, нейтральное выражение лица.'],bg:['Лице – отпред','Гледайте право напред, неутрално изражение.'],it:['Viso – di fronte','Guardi dritto davanti a sé, espressione neutra.'],pl:['Twarz – z przodu','Patrz prosto przed siebie, neutralny wyraz twarzy.'],ar:['الوجه – من الأمام','انظر إلى الأمام مباشرة بتعبير محايد.'],fa:['صورت – از روبه‌رو','مستقیم به جلو نگاه کنید، با حالت چهرهٔ خنثی.'],ro:['Fața – din față','Priviți drept înainte, cu expresie neutră.']},
profR:{tr:['Sağ profil','Sağ omzunuz telefona dönük olsun; tam yandan çekin.'],en:['Right profile','Turn your right shoulder to the phone; take it from the exact side.'],de:['Rechtes Profil','Rechte Schulter zum Telefon; genau von der Seite aufnehmen.'],fr:['Profil droit','Épaule droite vers le téléphone ; photo exactement de profil.'],es:['Perfil derecho','Hombro derecho hacia el teléfono; foto exactamente de lado.'],pt:['Perfil direito','Ombro direito virado para o telemóvel; foto exatamente de lado.'],ru:['Правый профиль','Повернитесь правым плечом к телефону; снимок строго сбоку.'],bg:['Десен профил','Дясното рамо към телефона; снимка точно отстрани.'],it:['Profilo destro','Spalla destra verso il telefono; foto esattamente di lato.'],pl:['Prawy profil','Prawe ramię w stronę telefonu; zdjęcie dokładnie z boku.'],ar:['الجانب الأيمن','اجعل كتفك الأيمن باتجاه الهاتف والتقط الصورة من الجانب تمامًا.'],fa:['نیم‌رخ راست','شانهٔ راست رو به گوشی؛ دقیقاً از پهلو عکس بگیرید.'],ro:['Profil drept','Umărul drept spre telefon; fotografie exact din lateral.']},
profL:{tr:['Sol profil','Sol omzunuz telefona dönük olsun; tam yandan çekin.'],en:['Left profile','Turn your left shoulder to the phone; take it from the exact side.'],de:['Linkes Profil','Linke Schulter zum Telefon; genau von der Seite aufnehmen.'],fr:['Profil gauche','Épaule gauche vers le téléphone ; photo exactement de profil.'],es:['Perfil izquierdo','Hombro izquierdo hacia el teléfono; foto exactamente de lado.'],pt:['Perfil esquerdo','Ombro esquerdo virado para o telemóvel; foto exatamente de lado.'],ru:['Левый профиль','Повернитесь левым плечом к телефону; снимок строго сбоку.'],bg:['Ляв профил','Лявото рамо към телефона; снимка точно отстрани.'],it:['Profilo sinistro','Spalla sinistra verso il telefono; foto esattamente di lato.'],pl:['Lewy profil','Lewe ramię w stronę telefonu; zdjęcie dokładnie z boku.'],ar:['الجانب الأيسر','اجعل كتفك الأيسر باتجاه الهاتف والتقط الصورة من الجانب تمامًا.'],fa:['نیم‌رخ چپ','شانهٔ چپ رو به گوشی؛ دقیقاً از پهلو عکس بگیرید.'],ro:['Profil stâng','Umărul stâng spre telefon; fotografie exact din lateral.']},
q34R:{tr:['Sağ yarım profil','Başınızı yarıya kadar sola çevirin (45°).'],en:['Right three-quarter','Turn your head halfway to the left (45°).'],de:['Rechts halbseitlich','Kopf halb nach links drehen (45°).'],fr:['Trois-quarts droit','Tournez la tête à moitié vers la gauche (45°).'],es:['Tres cuartos derecho','Gire la cabeza a medias hacia la izquierda (45°).'],pt:['Três quartos direito','Vire a cabeça a meio para a esquerda (45°).'],ru:['Полупрофиль справа','Поверните голову наполовину влево (45°).'],bg:['Полупрофил отдясно','Завъртете главата наполовина наляво (45°).'],it:['Tre quarti destro','Giri la testa a metà verso sinistra (45°).'],pl:['Półprofil prawy','Obróć głowę do połowy w lewo (45°).'],ar:['نصف جانبي أيمن','أدر رأسك إلى منتصف الطريق نحو اليسار (45°).'],fa:['نیم‌رخ ۴۵° راست','سر را تا نیمه به چپ بچرخانید (۴۵°).'],ro:['Trei sferturi dreapta','Întoarceți capul pe jumătate spre stânga (45°).']},
q34L:{tr:['Sol yarım profil','Başınızı yarıya kadar sağa çevirin (45°).'],en:['Left three-quarter','Turn your head halfway to the right (45°).'],de:['Links halbseitlich','Kopf halb nach rechts drehen (45°).'],fr:['Trois-quarts gauche','Tournez la tête à moitié vers la droite (45°).'],es:['Tres cuartos izquierdo','Gire la cabeza a medias hacia la derecha (45°).'],pt:['Três quartos esquerdo','Vire a cabeça a meio para a direita (45°).'],ru:['Полупрофиль слева','Поверните голову наполовину вправо (45°).'],bg:['Полупрофил отляво','Завъртете главата наполовина надясно (45°).'],it:['Tre quarti sinistro','Giri la testa a metà verso destra (45°).'],pl:['Półprofil lewy','Obróć głowę do połowy w prawo (45°).'],ar:['نصف جانبي أيسر','أدر رأسك إلى منتصف الطريق نحو اليمين (45°).'],fa:['نیم‌رخ ۴۵° چپ','سر را تا نیمه به راست بچرخانید (۴۵°).'],ro:['Trei sferturi stânga','Întoarceți capul pe jumătate spre dreapta (45°).']},
base:{tr:['Burun – alttan','Başınızı geriye yatırın; telefonu çenenizin altından tutun, burun delikleri görünsün.'],en:['Nose – from below','Tilt your head back and hold the phone below your chin so the nostrils show.'],de:['Nase – von unten','Kopf nach hinten neigen, Telefon unter das Kinn halten, Nasenlöcher sichtbar.'],fr:['Nez – par-dessous','Penchez la tête en arrière, téléphone sous le menton, narines visibles.'],es:['Nariz – desde abajo','Incline la cabeza hacia atrás y sostenga el teléfono bajo la barbilla, con las fosas nasales visibles.'],pt:['Nariz – por baixo','Incline a cabeça para trás, telemóvel por baixo do queixo, narinas visíveis.'],ru:['Нос – снизу','Запрокиньте голову, держите телефон под подбородком, чтобы были видны ноздри.'],bg:['Нос – отдолу','Наклонете главата назад, телефонът под брадичката, ноздрите да се виждат.'],it:['Naso – dal basso','Inclini la testa all’indietro, telefono sotto il mento, narici visibili.'],pl:['Nos – od dołu','Odchyl głowę, trzymaj telefon pod brodą, aby widać było nozdrza.'],ar:['الأنف – من الأسفل','أمِل رأسك للخلف وأمسك الهاتف أسفل ذقنك لتظهر فتحتا الأنف.'],fa:['بینی – از پایین','سر را به عقب ببرید و گوشی را زیر چانه بگیرید تا سوراخ‌های بینی دیده شوند.'],ro:['Nasul – de jos','Înclinați capul pe spate, telefonul sub bărbie, nările vizibile.']},
eyes:{tr:['Gözler – yakın','Gözleriniz açık, karşıya bakın; telefonu göz hizasında yakın tutun.'],en:['Eyes – close-up','Eyes open, look straight ahead; hold the phone close at eye level.'],de:['Augen – Nahaufnahme','Augen offen, geradeaus schauen; Telefon nah auf Augenhöhe halten.'],fr:['Yeux – gros plan','Yeux ouverts, regard droit ; téléphone proche, à hauteur des yeux.'],es:['Ojos – primer plano','Ojos abiertos, mirando al frente; teléfono cerca, a la altura de los ojos.'],pt:['Olhos – grande plano','Olhos abertos, olhar em frente; telemóvel perto, à altura dos olhos.'],ru:['Глаза – крупно','Глаза открыты, смотрите прямо; телефон близко на уровне глаз.'],bg:['Очи – отблизо','Очите отворени, гледайте напред; телефонът близо, на нивото на очите.'],it:['Occhi – primo piano','Occhi aperti, sguardo dritto; telefono vicino, all’altezza degli occhi.'],pl:['Oczy – zbliżenie','Oczy otwarte, patrz prosto; telefon blisko, na wysokości oczu.'],ar:['العينان – عن قرب','العينان مفتوحتان وانظر للأمام؛ أمسك الهاتف قريبًا بمستوى العينين.'],fa:['چشم‌ها – از نزدیک','چشم‌ها باز، به جلو نگاه کنید؛ گوشی را نزدیک و هم‌سطح چشم بگیرید.'],ro:['Ochii – prim-plan','Ochii deschiși, priviți înainte; telefonul aproape, la nivelul ochilor.']},

  q34R:`<path d="M160 60c-60 0-98 50-98 120 0 70 38 140 92 150 30 6 56-20 70-60 8-22 18-30 14-44l-10-12c10-16 4-40-2-60-10-58-30-94-66-94z" ${D}/><path d="M178 150l20 70-18 6" ${D} opacity=".55"/>`,
  q34L:`<g transform="translate(300,0) scale(-1,1)"><path d="M160 60c-60 0-98 50-98 120 0 70 38 140 92 150 30 6 56-20 70-60 8-22 18-30 14-44l-10-12c10-16 4-40-2-60-10-58-30-94-66-94z" ${D}/><path d="M178 150l20 70-18 6" ${D} opacity=".55"/></g>`,
  base:`<ellipse cx="150" cy="210" rx="95" ry="110" ${D}/><path d="M150 150c-30 20-48 60-46 86 18 8 32 4 46-6 14 10 28 14 46 6 2-26-16-66-46-86z" ${D}/><ellipse cx="130" cy="228" rx="9" ry="6" ${D}/><ellipse cx="170" cy="228" rx="9" ry="6" ${D}/>`,
  eyes:`<rect x="30" y="150" width="240" height="100" rx="40" ${D}/><ellipse cx="100" cy="200" rx="36" ry="18" ${D} opacity=".6"/><ellipse cx="200" cy="200" rx="36" ry="18" ${D} opacity=".6"/>`,
  smile:`<path d="M40 200q110-80 220 0q-110 110-220 0z" ${D}/><path d="M70 196q80-26 160 0M70 204q80 30 160 0" ${D} opacity=".55"/>`,
  smileR:`<path d="M60 200q90-70 200-10q-80 100-200 10z" ${D}/><path d="M90 198q70-20 140 0" ${D} opacity=".55"/>`,
  smileL:`<path d="M240 200q-90-70-200-10q80 100 200 10z" ${D}/><path d="M210 198q-70-20-140 0" ${D} opacity=".55"/>`,
  upper:`<path d="M70 300c0-150 30-210 80-210s80 60 80 210" ${D}/><path d="M110 290c0-110 16-160 40-160s40 50 40 160" ${D} opacity=".5"/>`,
  lower:`<path d="M70 100c0 150 30 210 80 210s80-60 80-210" ${D}/><path d="M110 110c0 110 16 160 40 160s40-50 40-160" ${D} opacity=".5"/>`,
  xray:`<rect x="30" y="120" width="240" height="160" rx="16" ${D}/><path d="M60 200q90-60 180 0q-90 60-180 0z" ${D} opacity=".55"/>`,
  torso:`<path d="M110 40h80l10 30c30 6 52 20 60 50l10 90-30 6-10-60v180H70V156l-10 60-30-6 10-90c8-30 30-44 60-50z" ${D}/>`,
  torsoS:`<path d="M140 40h40l6 30c24 10 30 40 28 70-2 34-16 50-14 80 2 40 10 80 6 120H110c-6-60-6-120 0-170 4-40 10-70 30-100z" ${D}/>`,
  body:`<circle cx="150" cy="50" r="24" ${D}/><path d="M118 80h64l34 20 22 120-22 4-20-90v100l10 150h-34l-22-120-22 120H94l10-150V134l-20 90-22-4 22-120z" ${D}/>`,
  bodyS:`<circle cx="152" cy="50" r="24" ${D}/><path d="M140 80h26c22 12 28 50 26 90-2 40-14 60-12 90l8 130h-30l-10-120-10 120h-24l4-130c-8-50-6-100 0-140 4-24 10-36 22-40z" ${D}/>`,
  hairF:`<ellipse cx="150" cy="200" rx="95" ry="130" ${D}/><path d="M70 150q80-70 160 0" ${D} opacity=".6"/>`,
  hairT:`<circle cx="150" cy="200" r="120" ${D}/><circle cx="150" cy="200" r="30" ${D} opacity=".5"/>`,
  hairB:`<path d="M60 200c0-90 40-140 90-140s90 50 90 140c0 60-30 100-90 110-60-10-90-50-90-110z" ${D}/><path d="M110 330v40M190 330v40" ${D} opacity=".55"/>`};


// ---------- Adım çizimleri (telefon nasıl tutulur) ----------
const SK='#f1d3bf', LN='#1f2a37', HR='#4a3a32', AR='#b48a45';
const phone = (x,y,r=0) => `<g transform="translate(${x} ${y}) rotate(${r})"><rect x="-6.5" y="-11" width="13" height="22" rx="2.6" fill="${LN}"/><rect x="-5" y="-8.5" width="10" height="15.5" rx="1.2" fill="#bfe3ef"/><circle cx="0" cy="8.8" r=".9" fill="#fff"/></g>`;
const arrow = (x1,y1,x2,y2) => { const a = Math.atan2(y2-y1,x2-x1), h = 5, p1 = [x2-h*Math.cos(a-.5), y2-h*Math.sin(a-.5)], p2 = [x2-h*Math.cos(a+.5), y2-h*Math.sin(a+.5)];
  return `<path d="M${x1} ${y1}L${x2} ${y2}" stroke="${AR}" stroke-width="2" stroke-dasharray="3 3" fill="none"/><path d="M${x2} ${y2}L${p1[0]} ${p1[1]}L${p2[0]} ${p2[1]}Z" fill="${AR}"/>`; };
const headF = (cx,cy,o={}) => `<path d="M${cx-24} ${cy+40}q24-22 48 0" fill="#cfd8e3" stroke="${LN}" stroke-width="1.4"/><rect x="${cx-5}" y="${cy+12}" width="10" height="12" fill="${SK}"/>
  <circle cx="${cx}" cy="${cy}" r="16" fill="${SK}" stroke="${LN}" stroke-width="1.4"/>
  <path d="M${cx-16} ${cy-2}q0-18 16-18q16 0 16 18q-4-9-16-10q-12 1-16 10z" fill="${HR}"/>${o.hairBack ? `<path d="M${cx-12} ${cy-9}q12-6 24 0" stroke="#fff" stroke-width="1" fill="none" opacity=".6"/>` : ''}
  <circle cx="${cx-6}" cy="${cy-1}" r="1.6" fill="${LN}"/><circle cx="${cx+6}" cy="${cy-1}" r="1.6" fill="${LN}"/>
  ${o.smile ? `<path d="M${cx-8} ${cy+6}q8 7 16 0z" fill="#fff" stroke="${LN}" stroke-width="1.2"/><path d="M${cx-7} ${cy+7.5}h14" stroke="${LN}" stroke-width=".6"/>` : `<path d="M${cx-5} ${cy+8}q5 2 10 0" stroke="${LN}" stroke-width="1.3" fill="none"/>`}`;
const headS = (cx,cy,r=0,o={}) => `<g transform="translate(${cx} ${cy}) rotate(${r})"><rect x="-6" y="10" width="11" height="14" fill="${SK}"/>
  <circle r="15" fill="${SK}" stroke="${LN}" stroke-width="1.4"/><path d="M13 -5l7 7-6 2" fill="${SK}" stroke="${LN}" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M-15 2q-2-19 15-18q12 0 15 9q-10-4-18-1q-4 6-12 10z" fill="${HR}"/><ellipse cx="-2" cy="2" rx="3" ry="4" fill="${SK}" stroke="${LN}" stroke-width="1"/>
  ${o.fem ? `<path d="M-12 -9q-14 6-12 30q3 12 9 18q-2-16 3-26z" fill="${HR}"/><path d="M6 -5l4-2M7 -3.5l4-1" stroke="${LN}" stroke-width=".8"/><path d="M9 8q4 2 7 0" stroke="#c0505e" stroke-width="2" fill="none" stroke-linecap="round"/>` : ''}<circle cx="8" cy="-3" r="1.5" fill="${LN}"/>${o.open ? `<path d="M9 7l8 1-6 5z" fill="#7a2730" stroke="${LN}" stroke-width=".8"/><path d="M10 7.6l6 .6" stroke="#fff" stroke-width="1.2"/>` : `<path d="M10 9h6" stroke="${LN}" stroke-width="1.3"/>`}</g>`;
const personF = (cx,o={}) => `<g stroke="${LN}" stroke-width="1.3"><circle cx="${cx}" cy="14" r="7" fill="${o.back?HR:SK}"/>${o.back?'':`<path d="M${cx-7} 12q0-8 7-8q7 0 7 8q-3-4-7-4q-4 0-7 4z" fill="${HR}" stroke="none"/>`}
  <path d="M${cx-9} 23h18l2 28h-22z" fill="#cfd8e3"/><path d="M${cx-9} 25l-9 22M${cx+9} 25l9 22" stroke-width="4" stroke-linecap="round" stroke="${SK}"/>
  <path d="M${cx-9} 25l-9 22M${cx+9} 25l9 22" fill="none" stroke-width="1"/><path d="M${cx-6} 51l-2 32M${cx+6} 51l2 32" stroke-width="4.5" stroke-linecap="round" stroke="${SK}"/><path d="M${cx-11} 51h22v6h-22z" fill="#9fb0c4"/></g>`;
const personS = cx => `<g stroke="${LN}" stroke-width="1.3"><circle cx="${cx}" cy="14" r="7" fill="${SK}"/><path d="M${cx-7} 13q0-9 8-9q5 0 6 4q-6 0-9 3z" fill="${HR}" stroke="none"/><path d="M${cx+6} 12l3 3-3 1" fill="${SK}"/>
  <path d="M${cx-6} 23h11l1 28h-13z" fill="#cfd8e3"/><path d="M${cx} 26l12 10" stroke-width="4" stroke-linecap="round" stroke="${SK}"/><path d="M${cx-3} 51l-1 32M${cx+3} 51l1 32" stroke-width="4.5" stroke-linecap="round" stroke="${SK}"/><path d="M${cx-7} 51h13v6h-13z" fill="#9fb0c4"/></g>`;
const torso = (cx,side) => side ? `<g stroke="${LN}" stroke-width="1.3"><rect x="${cx-5}" y="6" width="10" height="10" fill="${SK}"/><path d="M${cx-12} 16h18q8 10 6 22q-2 6-6 8l2 30h-22q-4-34 2-60z" fill="${SK}"/><path d="M${cx+4} 30q10 4 8 14q-6 4-10 0" fill="${SK}"/></g>`
  : `<g stroke="${LN}" stroke-width="1.3"><rect x="${cx-5}" y="6" width="10" height="10" fill="${SK}"/><path d="M${cx-26} 22q26-12 52 0l-4 58h-44z" fill="${SK}"/><path d="M${cx-18} 40q8 10 16 0M${cx+2} 40q8 10 16 0" fill="none"/></g>`;
const txt = (x,y,t) => `<text x="${x}" y="${y}" font-size="9" font-weight="700" fill="${AR}" text-anchor="middle" font-family="system-ui,sans-serif">${t}</text>`;
const PIC = {
  smile: headF(44,40,{smile:1}) + phone(96,34) + arrow(88,38,66,38),
  upper: headS(50,40,-35,{open:1}) + phone(74,76,-25) + arrow(72,64,62,50),
  lower: headS(48,46,30,{open:1}) + phone(78,13,25) + arrow(76,25,64,38),
  xray: `<rect x="18" y="20" width="84" height="50" rx="6" fill="#1f2a37"/><path d="M30 46q30-22 60 0" stroke="#e8edf2" stroke-width="6" fill="none" stroke-dasharray="4 1.5"/><path d="M30 50q30 18 60 0" stroke="#e8edf2" stroke-width="5" fill="none" stroke-dasharray="4 1.5"/>`,
  front: headF(44,40) + phone(96,34) + arrow(88,38,66,38),
  prof: headS(42,42,0) + phone(96,36) + arrow(88,40,64,40) + txt(76,70,'90°'),
  base: headS(50,38,-40,{fem:1}) + phone(72,76,-20) + arrow(70,64,60,48),
  hFront: headF(44,40,{hairBack:1}) + phone(96,34) + arrow(88,38,66,38),
  hTop: headS(44,50,55) + phone(70,14,0) + arrow(67,27,57,38),
  hBack: `<path d="M20 86q24-22 48 0" fill="#cfd8e3" stroke="${LN}" stroke-width="1.4"/><rect x="39" y="54" width="10" height="14" fill="${SK}"/><circle cx="44" cy="42" r="16" fill="${HR}" stroke="${LN}" stroke-width="1.4"/>` + phone(98,36) + arrow(90,40,66,40),
  bFront: personF(36) + phone(98,40) + arrow(90,44,52,44) + txt(72,62,'2 m'),
  bSide: personS(36) + phone(98,40) + arrow(90,44,52,44) + txt(72,62,'2 m'),
  bBack: personF(36,{back:1}) + phone(98,40) + arrow(90,44,52,44) + txt(72,62,'2 m'),
  brFront: torso(40,0) + phone(98,40) + arrow(90,44,68,44),
  brSide: torso(40,1) + phone(98,40) + arrow(90,44,68,44)};
const EX = new Set(['smile','open','upper','lower','front','prof','bFront','bSide','bBack','brFront','brSide','hFront','hSide','hBack']);
const pic = k => EX.has(k) ? `<img src="foto/ex_${k}.jpg" alt="" loading="lazy">` : `<svg viewBox="0 0 120 90" aria-hidden="true">${PIC[k]||''}</svg>`;
// Kamera çerçevesi: kılavuzun dışı hafif karartılır
const maskOv = inner => inner ? `<defs><style>.mk *{fill:#000 !important;stroke:#000 !important;stroke-dasharray:none !important;opacity:1 !important}</style><mask id="mk"><rect width="300" height="400" fill="#fff"/><g class="mk">${inner}</g></mask></defs><rect width="300" height="400" fill="rgba(10,18,30,.38)" mask="url(#mk)"/>${inner}` : '';

// ---------- Yardımcılar ----------
const $ = id => document.getElementById(id);
const tx = (k, p={}) => String((T[L]||T.en)[k] ?? T.en[k] ?? '').replace(/\{(\w)\}/g, (_,x)=>p[x] ?? '');
const st = k => (S[k] && (S[k][L] || S[k].en)) || [k,''];
const first = NAME.split(/\s+/)[0] || '';
const slug = s => s.normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
document.documentElement.lang = L; if (L==='ar' || L==='fa') document.documentElement.dir = 'rtl';
document.title = 'Renewal Medical Clinic · ' + tx('sub');

const SHOTS = STEPS.map(()=>null);   // {blob,url}
let cur = 0, stream = null, facing = 'user', timer = false, busy = false;

// ---------- Giriş ekranı ----------
$('hSub').textContent = tx('sub');
$('tTitle').textContent = tx('title', {n: first ? ' ' + first : ''});
$('tIntro').textContent = tx('intro');
$('tLight').textContent = '💡 ' + tx('light');
$('tConsent').textContent = tx('consent');
$('bStart').textContent = tx('start') + ' →';
$('tPrivacy').textContent = $('tPrivacy2').textContent = '🔒 ' + tx('privacy');
$('stepList').innerHTML = STEPS.map((s,i)=>`<li><div class="pic">${pic(s.k)}</div><span><b>${i+1}.</b> ${esc(st(s.k)[0])}${s.opt ? ' <span class="muted">(' + esc(tx('optional')) + ')</span>' : ''}</span></li>`).join('');
$('consent').onchange = e => $('bStart').disabled = !e.target.checked;
$('bStart').onclick = () => { show('vCam'); goStep(0); };
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function show(v){ ['vIntro','vCam','vReview','vDone'].forEach(x=>$(x).hidden = x!==v); window.scrollTo(0,0); }

// ---------- Kamera ----------
async function startCam(){
  stopCam(); $('camMsg').hidden = true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ camFail(); return; }
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}, width:{ideal:1920}, height:{ideal:1440}}, audio:false});
    const v = $('vid'); v.srcObject = stream; v.classList.toggle('mir', facing==='user'); mirOv(); await v.play().catch(()=>{});
    $('bShoot').disabled = false;
  }catch(e){ camFail(); }
}
// Kılavuz çizimi gerçek kamera görüntüsüne göre; ön kamerada önizleme aynalı olduğu için çizim de aynalanır
function mirOv(){ $('ov').style.transform = (stream && facing==='user') ? 'scaleX(-1)' : ''; }
function stopCam(){ if (stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; } }
function camFail(){ $('camMsg').textContent = tx('camErr'); $('camMsg').hidden = false; $('bShoot').disabled = true; }

function goStep(i){
  cur = i; const s = STEPS[i], [ttl, tip] = st(s.k);
  $('sTitle').textContent = ttl + (s.opt ? ' (' + tx('optional') + ')' : '');
  $('sCount').textContent = tx('step', {a:i+1, b:STEPS.length});
  $('sTip').textContent = tip; $('sHelp').hidden = !s.help; $('sHelp').textContent = '👥 ' + tx('help');
  $('prog').innerHTML = STEPS.map((_,k)=>`<span class="${SHOTS[k]?'done':k===i?'cur':''}"></span>`).join('');
  $('ov').innerHTML = maskOv(OV[s.ov] || ''); mirOv();
  $('sPic').innerHTML = pic(s.k); $('fLab').textContent = tx('frame'); $('fLab').hidden = !!s.gal;
  timer = !!s.help; $('bTimer').classList.toggle('on', timer);
  $('bSkip').textContent = tx('skip') + ' ›';
  if (SHOTS[i]) { showShot(SHOTS[i].url); return; }
  $('shot').hidden = true; $('ctrlLive').hidden = false; $('ctrlShot').hidden = true;
  if (s.gal){ stopCam(); $('vid').srcObject = null; $('ctrlLive').hidden = true; $('camMsg').hidden = true; return; }
  const want = s.cam || 'user'; if (!stream || want !== facing){ facing = want; startCam(); }
}
function showShot(url){ $('shot').src = url; $('shot').hidden = false; $('ov').innerHTML = ''; $('fLab').hidden = true; $('ctrlLive').hidden = true; $('ctrlShot').hidden = false; }

$('tFlip').textContent = tx('flip');
$('bFlip').onclick = () => { facing = facing==='user' ? 'environment' : 'user'; startCam(); };
$('bTimer').onclick = () => { timer = !timer; $('bTimer').classList.toggle('on', timer); };
$('bShoot').onclick = async () => {
  if (busy || !stream) return; busy = true;
  if (timer){ const c = $('cnt'); c.hidden = false; for (const n of [3,2,1]){ c.textContent = n; await new Promise(r=>setTimeout(r, 900)); } c.hidden = true; }
  const v = $('vid'), vw = v.videoWidth, vh = v.videoHeight;
  if (!vw){ busy = false; return; }
  // Ekranda görünen 3:4 alanı kırp; ön kamerada ayna görüntüsü kaydedilmez (sağ-sol doğru kalsın)
  let sw = vw, sh = vw*4/3; if (sh > vh){ sh = vh; sw = vh*3/4; }
  const sx = (vw-sw)/2, sy = (vh-sh)/2, sc = Math.min(1, 1600/sh);
  const cv = document.createElement('canvas'); cv.width = Math.round(sw*sc); cv.height = Math.round(sh*sc);
  cv.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r=>cv.toBlob(r, 'image/jpeg', .88));
  busy = false; if (!blob) return;
  setShot(cur, blob); showShot(SHOTS[cur].url);
  if (navigator.vibrate) navigator.vibrate(30);
};
function setShot(i, blob){ if (SHOTS[i]) URL.revokeObjectURL(SHOTS[i].url); SHOTS[i] = {blob, url:URL.createObjectURL(blob)}; }
$('bRetake').textContent = tx('retake'); $('bUse').textContent = tx('use') + ' ✓';
$('bRetake').onclick = () => { if (SHOTS[cur]) { URL.revokeObjectURL(SHOTS[cur].url); SHOTS[cur] = null; } goStep(cur); };
$('bUse').onclick = () => next();
$('bSkip').onclick = () => next();
function next(){ if (cur < STEPS.length-1) goStep(cur+1); else review(); }

// Galeriden seçilen fotoğraf küçültülüp aynı biçimde kaydedilir
$('bGallery').textContent = '🖼 ' + tx('gallery');
$('bGallery').onclick = () => $('fGal').click();
$('fGal').onchange = async e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  let blob = f; try{ const bmp = await createImageBitmap(f); const sc = Math.min(1, 1800/Math.max(bmp.width,bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width*sc); cv.height = Math.round(bmp.height*sc); cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    blob = await new Promise(r=>cv.toBlob(r,'image/jpeg',.88)) || f; }catch(_){}
  setShot(cur, blob); stopCam(); showShot(SHOTS[cur].url); };

// ---------- Gözden geçirme ve gönderme ----------
const fileName = i => { const pre = NAME ? slug(NAME) + '_' : ''; return `${pre}${String(i+1).padStart(2,'0')}_${STEPS[i].k}.jpg`; };
function files(){ return SHOTS.map((s,i)=>s && new File([s.blob], fileName(i), {type:'image/jpeg'})).filter(Boolean); }
function review(){
  stopCam(); show('vReview');
  $('rTitle').textContent = tx('review');
  $('thumbs').innerHTML = STEPS.map((s,i)=> SHOTS[i]
    ? `<figure><img src="${SHOTS[i].url}" alt=""><figcaption>${i+1}. ${esc(st(s.k)[0])}</figcaption><button type="button" data-redo="${i}">${esc(tx('retakeOne'))}</button></figure>`
    : `<figure class="miss" data-redo="${i}">${i+1}. ${esc(st(s.k)[0])}<br>— ${esc(tx('missing'))} —</figure>`).join('');
  $('rHint').textContent = '📲 ' + tx('hint');
  $('bSend').textContent = tx('send'); $('bSend').disabled = !files().length;
  $('fallback').hidden = true;
}
$('thumbs').onclick = e => { const r = e.target.closest('[data-redo]'); if (r){ show('vCam'); goStep(+r.dataset.redo); } };
$('bSend').onclick = async () => {
  const fs = files(); if (!fs.length) return;
  const text = tx('shareText', {n: NAME ? ' – ' + NAME : ''});
  if (navigator.canShare && navigator.canShare({files:fs})){
    try{ await navigator.share({files:fs, text}); done(); return; }
    catch(e){ if (e && e.name==='AbortError') return; }
  }
  fallback(fs, text);
};
function fallback(fs, text){
  $('fallback').hidden = false; $('tFallback').textContent = tx('fallback');
  $('dlList').innerHTML = fs.map((f,i)=>`<a href="${URL.createObjectURL(f)}" download="${esc(f.name)}">⬇ ${esc(tx('dl'))} ${i+1}: ${esc(f.name)}</a>`).join('');
  const wa = $('bWa'); wa.hidden = false; wa.textContent = tx('wa');
  wa.onclick = () => { location.href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(text); };
}
function done(){ show('vDone'); $('dTitle').textContent = tx('done'); $('bAgain').textContent = tx('again'); }
$('bAgain').onclick = () => review();
document.addEventListener('visibilitychange', ()=>{ if (document.hidden) stopCam(); else if (!$('vCam').hidden && !SHOTS[cur] && !STEPS[cur].gal) startCam(); });
</script>
</body>
</html>
