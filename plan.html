<html lang="en">

<style>
:root{--navy:#0f1b2d;--teal:#1d4e5f;--gold:#b48a45;--gold2:#f2d38f;--red:#b3262f;--ink:#111827;--ink2:#374151;--muted:#6b7280;--line:#e6e9ef;--bg:#f4f6f9}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree','Inter','Segoe UI',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:96px}
.hero{background:linear-gradient(135deg,#0b1a2b 0%,#12384a 60%,#0d2b3a 100%);color:#fff;padding:22px 20px 70px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(242,211,143,.22),transparent 70%)}
.brand{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.brand img{width:44px;height:44px;border-radius:50%;background:#fff;padding:3px;object-fit:contain}
.brand b{font-family:Georgia,'Times New Roman',serif;font-size:1.1rem;letter-spacing:.01em}
.brand small{display:block;font-size:.72rem;color:rgba(255,255,255,.65);letter-spacing:.04em}
.hero .in{max-width:760px;margin:26px auto 0;position:relative;z-index:1}
.kick{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2)}
.hero h1{font-family:Georgia,'Times New Roman',serif;font-weight:500;font-size:1.9rem;line-height:1.2;margin:8px 0 10px}
.hero p{margin:0;color:rgba(255,255,255,.82);font-size:.98rem}
main{max-width:760px;margin:-46px auto 0;padding:0 14px;position:relative;z-index:2;display:grid;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 20px rgba(15,27,45,.06)}
.card h2{margin:0 0 10px;font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.story{font-size:1.02rem;color:var(--ink2);margin:0}
/* simülasyon */
.sim{padding:0;overflow:hidden}
.sim .sh{padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sim .sh h2{margin:0}
.stage{position:relative;background:#0b1a2b;display:grid;place-items:center;width:100%;aspect-ratio:4/3;margin:0 auto;overflow:hidden}
.stage.on{aspect-ratio:9/16;max-height:78vh;background:#efe5d8}
.ctl[hidden],.note[hidden],.ctl button[hidden]{display:none!important}
.stage canvas{display:block;width:100%;height:100%;object-fit:contain}
.poster{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:12px;text-align:center;padding:20px;background:linear-gradient(180deg,rgba(11,26,43,.25),rgba(11,26,43,.75)),url('br/dent.jpg?v=2') center/cover;cursor:pointer;border:0;width:100%;font:inherit;color:#fff}
.poster .pl{width:86px;height:86px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 10px 30px rgba(179,38,47,.35);transition:transform .2s}
.poster:hover .pl{transform:scale(1.06)}
.poster .pl svg{width:34px;height:34px;margin-left:5px;fill:#fff}
.poster b{font-family:Georgia,serif;font-size:1.35rem;font-weight:500}
.poster span{color:rgba(255,255,255,.85);font-size:.9rem}
.poster b{text-shadow:0 2px 10px rgba(0,0,0,.4)}
.ctl{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.ctl button{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;font-size:1.1rem;color:var(--navy)}
.ctl button.main{background:var(--navy);color:#fff;border-color:var(--navy)}
.ctl button:disabled{opacity:.4}
.bar{flex:1;height:6px;border-radius:6px;background:#e9edf2;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:6px}
.note{padding:0 16px 14px;font-size:.78rem;color:var(--muted)}
.load{position:absolute;inset:0;display:none;place-items:center;align-content:center;gap:10px;background:rgba(255,253,249,.9);font-weight:600;color:var(--ink2)}
.load.on{display:grid}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid #e3d8ca;border-top-color:var(--red);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* seanslar ve fiyat */
.ses{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px;border-left:4px solid var(--teal)}
.ses:first-of-type{margin-top:0}
.ses .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.ses .t b{font-size:1rem;color:var(--navy)}
.ses .t em{font-style:normal;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.ses .st{font-size:.84rem;color:var(--muted);margin:2px 0 8px}
.ses ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.ses li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;color:var(--ink2)}
.ses li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:.5em}
.ses .pl2{margin-top:8px;font-size:.8rem;color:var(--muted)}
.tot{background:linear-gradient(135deg,#0b1a2b,#14384a);color:#fff;border:0}
.tot .r{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tot .r span{font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.tot .r b{font-family:Georgia,serif;font-size:2.2rem;font-weight:500;color:var(--gold2);font-variant-numeric:tabular-nums}
.tot p{margin:8px 0 0;font-size:.86rem;color:rgba(255,255,255,.78)}
.inc{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 16px}
.inc li{display:flex;gap:10px;align-items:flex-start;font-size:.93rem;color:var(--ink2)}
.inc li i{font-style:normal;flex:none;width:22px;text-align:center}
.ab{display:grid;gap:10px}
.ab details{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fafbfc}
.ab summary{cursor:pointer;font-weight:700;color:var(--navy);list-style:none;display:flex;justify-content:space-between;gap:10px}
.ab summary::-webkit-details-marker{display:none}
.ab summary::after{content:"＋";color:var(--teal);font-weight:800}
.ab details[open] summary::after{content:"－"}
.ab p{margin:8px 0 0;color:var(--ink2);font-size:.94rem}
.doc{display:flex;gap:14px;align-items:center}
.doc img{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:none;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.doc b{display:block;font-family:Georgia,serif;font-size:1.15rem;font-weight:500}
.doc span{font-size:.84rem;color:var(--muted)}
.meta{display:grid;gap:6px;font-size:.9rem;color:var(--ink2)}
.meta div{display:flex;gap:10px}
.sign{margin-top:12px;color:var(--muted);font-size:.9rem;white-space:pre-line}
footer{max-width:760px;margin:18px auto 0;padding:0 18px;text-align:center;color:var(--muted);font-size:.8rem;display:grid;gap:4px}
footer a{color:var(--teal);text-decoration:none}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center}
.cta a{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:520px;padding:14px 18px;border-radius:14px;background:#1f9d55;color:#fff;font-weight:800;font-size:1rem;text-decoration:none;box-shadow:0 8px 20px rgba(31,157,85,.28)}
.cta svg{width:22px;height:22px;fill:#fff}
.err{max-width:520px;margin:80px auto;padding:24px;text-align:center;background:#fff;border-radius:16px;border:1px solid var(--line)}
[dir="rtl"] .ses{border-left:1px solid var(--line);border-right:4px solid var(--teal)}
@media (min-width:720px){ .hero h1{font-size:2.4rem} .card{padding:22px 24px} }
</style>
</head>

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = s => String(s||'').replace(/^[\u{1F300}-\u{1FAFF}☀-➿️‍\s]+/u,'');
async function decode(h){
  const m = /^([zj])\.([A-Za-z0-9_-]+)$/.exec(h); if (!m) throw new Error('bad');
  const b = atob(m[2].replace(/-/g,'+').replace(/_/g,'/')), u = Uint8Array.from(b, c=>c.charCodeAt(0));
  let bytes = u;
  if (m[1]==='z'){ const ds = new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw')); bytes = new Uint8Array(await new Response(ds).arrayBuffer()); }
  return JSON.parse(new TextDecoder().decode(bytes)); }
const WAI = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 12 12 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';

  const l = UIX[P.l] ? P.l : 'en', U = UIX[l];
  document.documentElement.lang = l; if (['ar','fa'].includes(l)) document.documentElement.dir = 'rtl';
  document.title = `${U.kick} · Renewal Medical Clinic`;
  const waTxt = encodeURIComponent(U.waMsg.replace('{q}', P.qno||''));
  app.innerHTML = `

      <div class="note" id="vnote" hidden></div></section>` : ''}
    <section class="card"><h2>${esc(U.prices)}</h2>${(P.ses||[]).map(s=>`<div class="ses"><div class="t"><b>${esc(s.t)}</b>${s.price ? `<em>${esc(s.price)}</em>` : ''}</div>${s.stay ? `<div class="st">${esc(s.stay)}</div>` : ''}

    <section class="card tot"><div class="r"><span>${esc(P.totalLbl||U.total)}</span><b>${esc(P.total)}</b></div>${P.pay ? `<p>${esc(P.pay)}</p>` : ''}${!P.pay && P.incNote ? `<p>${esc(P.incNote)}</p>` : ''}</section>
    <section class="card"><h2>${esc(strip(P.incLbl))}</h2><ul class="inc">${(P.inc||[]).map(x=>{ const m = /^(\S+)\s+(.*)$/u.exec(x); return `<li><i>${esc(m?m[1]:'✓')}</i><span>${esc(m?m[2]:x)}</span></li>`; }).join('')}</ul></section>

function setupSim(P, l, U){
  const g = id => document.getElementById(id);
  let V = null, D = 0, CUES = [], t = 0, playing = false, last = 0, ci = 0, speaking = false, sound = true, voice = null;
  const synth = window.speechSynthesis;
  const pickVoice = () => { if (!synth) return null; const vs = synth.getVoices(), lc = LOC[l] || l; return vs.find(v=>v.lang===lc) || vs.find(v=>v.lang && v.lang.toLowerCase().startsWith(l)) || null; };
  if (synth){ voice = pickVoice(); synth.onvoiceschanged = () => { voice = pickVoice(); }; }
  async function load(){
    g('load').classList.add('on');
    const [THREE, {GLTFLoader}, {RoomEnvironment}, {DecalGeometry}, {create}] = await Promise.all([
      import('./lib/three.module.js'), import('./lib/GLTFLoader.js'), import('./lib/RoomEnvironment.js'), import('./lib/DecalGeometry.js'), import('./vid3d/dent3d.js')]);
    const fonts = {}; await Promise.all(['lora','reg','med','ireg','arf'].map(async k=>{ fonts[k] = await (await fetch(`fonts/${k}.json`)).json(); }));
    const logo = await new Promise((ok,bad)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=bad; i.src='tpl/dent/logo_big.png'; });
    const canvas = document.createElement('canvas');
    V = await create({THREE, GLTFLoader, RoomEnvironment, DecalGeometry, canvas, glbUrl:'vid3d/mouth3d.json', fonts, logo, shape: typeof shapeArabic==='function' ? shapeArabic : (s=>s)});
    D = V.build(P.sim); CUES = V.cues || [];
    for (let k=0; k<D; k+=0.5) V.frame(k);   // ısınma: takılma olmasın
    V.frame(0); g('stage').classList.add('on'); g('stage').prepend(canvas); g('poster').remove(); g('load').classList.remove('on'); g('ctl').hidden = false;
    if (!synth || !voice){ sound = false; g('snd').hidden = true; g('vnote').textContent = U.noVoice; g('vnote').hidden = false; }
  }
  function say(s){ if (!sound || !synth || !voice || !s) return; const u = new SpeechSynthesisUtterance(s); u.lang = voice.lang; u.voice = voice; u.rate = 0.95;
    speaking = true; u.onend = u.onerror = () => { speaking = false; }; synth.speak(u); }
  function tick(now){ if (!playing) return; const dt = Math.min(0.1, (now-last)/1000); last = now;
    while (ci < CUES.length && t >= CUES[ci].t){ say(CUES[ci].s); ci++; }
    const hold = speaking && ci < CUES.length && t >= CUES[ci].t - 0.05;   // anlatım bitmeden sonraki adıma geçme
    if (!hold) t = Math.min(D, t + dt);
    V.frame(t); g('pb').style.width = (t/D*100).toFixed(1)+'%';
    if (t >= D && !speaking){ playing = false; g('pp').textContent = '▶'; return; }
    requestAnimationFrame(tick); }
  function play(){ if (t >= D){ t = 0; ci = 0; } playing = true; last = performance.now(); g('pp').textContent = '❚❚'; if (synth) synth.resume(); requestAnimationFrame(tick); }
  function pause(){ playing = false; g('pp').textContent = '▶'; if (synth){ synth.cancel(); speaking = false; } }
  g('poster').onclick = async () => { if (synth && voice){ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u); }   // iOS: sesi ilk dokunuşta aç
    try{ await load(); play(); }catch(e){ g('load').classList.remove('on'); g('vnote').textContent = U.bad; g('vnote').hidden = false; } };
  g('pp').onclick = () => playing ? pause() : play();
  g('rw').onclick = () => { pause(); t = 0; ci = 0; V.frame(0); g('pb').style.width = '0'; play(); };
  g('snd').onclick = () => { sound = !sound; g('snd').textContent = sound ? '🔊' : '🔇'; g('snd').setAttribute('aria-label', sound ? U.soundOn : U.soundOff); if (!sound && synth){ synth.cancel(); speaking = false; } };
}
